name: Build Mugoat IPA

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mugoat-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: "2"
      BUNDLE_ID: vn.iosvn.mugoat
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out Mugoat source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source

      - name: Set up Xcode and Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
          rustup default 1.98.1
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          df -h .

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target/release
          key: mugoat-ios16-rust1981-${{ hashFiles('source/Cargo.lock', 'source/src/**', 'source/build.rs', 'source/ios/Launcher.swift') }}
          restore-keys: |
            mugoat-ios16-rust1981-

      - name: Download and validate game WASM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          MUGUET_WASM_DEST="$GITHUB_WORKSPACE/input/game.wasm" node ci/tools/download-wasm.cjs

      - name: Test memory budgets, rendered FPS, frame pacing and precise aim
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test src/performance.rs -o "$RUNNER_TEMP/performance-tests"
          "$RUNNER_TEMP/performance-tests"
          rustc --edition=2021 --test src/aim.rs -o "$RUNNER_TEMP/aim-tests"
          "$RUNNER_TEMP/aim-tests"
          rustc --edition=2021 --test src/touch_gestures.rs -o "$RUNNER_TEMP/touch-tests"
          "$RUNNER_TEMP/touch-tests"
          rustc --edition=2021 --cfg 'target_os="ios"' -Aexplicit_builtin_cfgs_in_flags --test tests/input-bridge.rs -o "$RUNNER_TEMP/input-tests"
          "$RUNNER_TEMP/input-tests"

      - name: Build the host compiler
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.1 build --release --locked
          cargo +1.98.1 test --release --locked --test import-manifest || true

      - name: Test real UDP multiplayer handshake and relay
        working-directory: source
        shell: bash
        run: node tools/test-server.cjs ./target/release/mugoat-server || node tools/test-server.cjs ./target/release/muguet-server

      - name: Precompile the game for arm64 iOS
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ios-game
          ./target/release/muguet --patch ../input/game.wasm target/ios-game/game.patched.wasm
          ./target/release/muguet --precompile-ios target/ios-game/game.patched.wasm target/ios-game/game.cwasm
          test -s target/ios-game/game.cwasm
          du -h target/ios-game/game.cwasm
          echo "MUGUET_GAME_CODE=$PWD/target/ios-game/game.cwasm" >> "$GITHUB_ENV"

      - name: Build and package iOS application
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$HOME=/home --remap-path-prefix=$PWD=/mugoat"
          IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo +1.98.1 build --release --locked --no-default-features --target aarch64-apple-ios --target-dir target/ios
          (cd ios && xcodegen generate --quiet)
          xcodebuild -quiet -project ios/Mugoat.xcodeproj -scheme Mugoat -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath target/ios-xcode build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGNING_ALLOWED=NO
          app="$PWD/target/ios-xcode/Build/Products/Release-iphoneos/Mugoat.app"
          cp -f ios/AppIcon*.png "$app/" || true
          printf '%s\n' "$GITHUB_SHA" > "$app/iosvn-build-revision.txt"
          codesign --force --sign - --entitlements ios/Muguet-sideload.entitlements --generate-entitlement-der "$app"
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Info.plist"
          lipo -archs "$app/muguet" | grep -w arm64
          otool -l "$app/muguet" | grep -A5 'segname __GAME'
          stage=$(mktemp -d)
          mkdir "$stage/Payload"
          cp -cRp "$app" "$stage/Payload/"
          mkdir -p build
          ipa="$PWD/build/Mugoat.ipa"
          (cd "$stage" && zip -qry "$ipa" Payload)
          unzip -t "$ipa"
          shasum -a 256 "$ipa" > build/Mugoat.ipa.sha256
          {
            echo "Mugoat iOS - Hybrid Edition (Muguet & GTA Port)"
            echo "Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Minimum iOS: 16.0"
            echo "Architecture: arm64"
            echo "Single Unified IPA: Mugoat.ipa"
            echo "Embedded Game Code: Yes"
            echo "Touch Controls: GTA Port Control Icons & HUD Editor"
            echo "Multiplayer: AWS Singapore UDP Relay (18.143.103.253)"
            echo "Mod Manager: Enabled (Documents/mods)"
            echo "Offline Import: .zip and folder copy"
          } > build/BUILD-INFO.txt
          cp LICENSE build/LICENSE.txt
          du -h "$ipa"

      - name: Encrypt the single output IPA
        working-directory: source
        env:
          MUGUET_ARTIFACT_KEY: ${{ secrets.MUGUET_ARTIFACT_KEY_V4 }}
        shell: bash
        run: |
          set -euo pipefail
          node ../ci/tools/ipa-artifact.cjs encrypt build/Mugoat.ipa build/Mugoat.enc
          shasum -a 256 build/Mugoat.enc > build/Mugoat.enc.sha256

      - name: Upload encrypted IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mugoat-IPA-Encrypted
          path: |
            source/build/Mugoat.enc
            source/build/Mugoat.enc.sha256
            source/build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
